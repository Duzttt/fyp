<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f4"/>
      <stop offset="100%" style="stop-color:#f0ece4"/>
    </linearGradient>
    <filter id="shadow9">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#bg9)"/>

  <!-- Title decoration -->
  <rect x="380" y="15" width="200" height="2" rx="1" fill="#b45309" opacity="0.2"/>

  <!-- Left side: Text input -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#a8a29e" letter-spacing="1">INPUT TEXT</text>

    <!-- Document with highlighted words -->
    <g transform="translate(0, 15)" filter="url(#shadow9)">
      <rect width="220" height="130" rx="8" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
      <g transform="translate(16, 16)">
        <rect width="80" height="8" rx="4" fill="#b45309" opacity="0.3"/>
        <rect x="85" width="55" height="8" rx="4" fill="#e7e5e0"/>
        <rect y="14" width="120" height="8" rx="4" fill="#e7e5e0"/>
        <rect y="28" width="95" height="8" rx="4" fill="#b45309" opacity="0.2"/>
        <rect y="42" width="140" height="8" rx="4" fill="#e7e5e0"/>
        <rect y="56" width="70" height="8" rx="4" fill="#e7e5e0"/>
        <rect y="70" width="110" height="8" rx="4" fill="#b45309" opacity="0.15"/>
        <rect y="84" width="130" height="8" rx="4" fill="#e7e5e0"/>
      </g>
    </g>

    <!-- Arrow pointing to embedding -->
    <path d="M230,80 L280,80" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b45309"/>
      </marker>
    </defs>
  </g>

  <!-- Center: Embedding model -->
  <g transform="translate(310, 65)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#a8a29e" letter-spacing="1">EMBEDDING MODEL</text>

    <g transform="translate(-10, 15)" filter="url(#shadow9)">
      <rect width="240" height="100" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
      <rect x="16" y="14" width="208" height="72" rx="6" fill="#fef3c7" opacity="0.5"/>

      <!-- Model brain icon -->
      <circle cx="40" cy="50" r="18" fill="#b45309" opacity="0.15"/>
      <text x="40" y="55" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#b45309">🧠</text>

      <text x="68" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1917">MiniLM-L6</text>
      <text x="68" y="52" font-family="monospace" font-size="10" fill="#a8a29e">384 dimensions</text>
      <text x="68" y="66" font-family="monospace" font-size="10" fill="#a8a29e">~80 MB model</text>
    </g>

    <!-- Output vector -->
    <g transform="translate(120, 125)">
      <rect width="100" height="30" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
      <text x="50" y="20" font-family="monospace" font-size="9" fill="#92400e" text-anchor="middle">[0.12, -0.45, ...]</text>
    </g>
  </g>

  <!-- Arrow to vector space -->
  <path d="M570,200 L620,200" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Right side: Vector space visualization -->
  <g transform="translate(630, 30)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#a8a29e" letter-spacing="1">VECTOR SPACE (FAISS)</text>

    <g transform="translate(0, 15)" filter="url(#shadow9)">
      <rect width="280" height="220" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>

      <!-- Grid lines -->
      <g opacity="0.08" stroke="#a8a29e" stroke-width="0.5">
        <line x1="0" y1="44" x2="280" y2="44"/>
        <line x1="0" y1="88" x2="280" y2="88"/>
        <line x1="0" y1="132" x2="280" y2="132"/>
        <line x1="0" y1="176" x2="280" y2="176"/>
        <line x1="56" y1="0" x2="56" y2="220"/>
        <line x1="112" y1="0" x2="112" y2="220"/>
        <line x1="168" y1="0" x2="168" y2="220"/>
        <line x1="224" y1="0" x2="224" y2="220"/>
      </g>

      <!-- Vector points -->
      <circle cx="80" cy="50" r="6" fill="#b45309" opacity="0.7"/>
      <circle cx="160" cy="80" r="5" fill="#b45309" opacity="0.5"/>
      <circle cx="100" cy="120" r="7" fill="#b45309" opacity="0.8"/>
      <circle cx="200" cy="60" r="4" fill="#b45309" opacity="0.4"/>
      <circle cx="140" cy="160" r="5" fill="#b45309" opacity="0.6"/>
      <circle cx="60" cy="180" r="4" fill="#b45309" opacity="0.35"/>
      <circle cx="220" cy="140" r="6" fill="#b45309" opacity="0.55"/>
      <circle cx="180" cy="200" r="3" fill="#b45309" opacity="0.3"/>
      <circle cx="50" cy="100" r="4" fill="#b45309" opacity="0.45"/>

      <!-- Query point (highlighted) -->
      <circle cx="120" cy="90" r="9" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="120" cy="90" r="4" fill="#f59e0b"/>
      <text x="120" y="115" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="600">Q</text>

      <!-- Nearest neighbors highlighted -->
      <line x1="120" y1="90" x2="100" y2="120" stroke="#b45309" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
      <line x1="120" y1="90" x2="80" y2="50" stroke="#b45309" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
      <line x1="120" y1="90" x2="160" y2="80" stroke="#b45309" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
    </g>

    <!-- Labels -->
    <g transform="translate(0, 250)">
      <rect width="10" height="10" rx="5" fill="#f59e0b"/>
      <text x="16" y="9" font-family="system-ui, sans-serif" font-size="9" fill="#57534e">Query vector</text>
      <rect x="110" width="10" height="10" rx="5" fill="#b45309" opacity="0.6"/>
      <text x="126" y="9" font-family="system-ui, sans-serif" font-size="9" fill="#57534e">Document vectors</text>
    </g>
  </g>

  <!-- L2 Distance annotation -->
  <g transform="translate(680, 300)">
    <rect width="180" height="30" rx="6" fill="#f0ece4"/>
    <text x="90" y="20" font-family="monospace" font-size="10" fill="#57534e" text-anchor="middle">d = Σ(qi - di)²  (L2 metric)</text>
  </g>

  <!-- Decorative -->
  <circle cx="30" cy="380" r="20" fill="#b45309" opacity="0.03"/>
  <circle cx="930" cy="50" r="15" fill="#b45309" opacity="0.04"/>
</svg>