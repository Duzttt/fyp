<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f4"/>
      <stop offset="100%" style="stop-color:#f0ece4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="820" cy="80" r="120" fill="#fef3c7" opacity="0.4"/>
  <circle cx="140" cy="350" r="80" fill="#fde68a" opacity="0.3"/>
  <circle cx="700" cy="320" r="60" fill="#b45309" opacity="0.06"/>

  <!-- Book stack left -->
  <g transform="translate(60, 140)">
    <rect x="0" y="40" width="100" height="16" rx="2" fill="#92400e" opacity="0.7"/>
    <rect x="5" y="28" width="90" height="14" rx="2" fill="#b45309" opacity="0.8"/>
    <rect x="2" y="16" width="95" height="14" rx="2" fill="#d97706" opacity="0.75"/>
    <rect x="8" y="4" width="85" height="14" rx="2" fill="#f59e0b" opacity="0.8"/>
    <!-- Pages visible -->
    <rect x="8" y="17" width="84" height="12" rx="1" fill="#faf8f4" opacity="0.5"/>
  </g>

  <!-- Central brain/AI icon -->
  <g transform="translate(400, 100)">
    <!-- Glowing circle -->
    <circle cx="80" cy="100" r="70" fill="none" stroke="#b45309" stroke-width="1" opacity="0.2"/>
    <circle cx="80" cy="100" r="55" fill="none" stroke="#b45309" stroke-width="1" opacity="0.15"/>
    <!-- Brain shape -->
    <path d="M60,75 C45,75 35,90 40,105 C35,115 45,130 60,128 C55,140 70,148 80,140 C90,148 105,140 100,128 C115,130 125,115 120,105 C125,90 115,75 100,75 C105,65 95,55 80,60 C65,55 55,65 60,75Z" fill="url(#accent)" opacity="0.85"/>
    <!-- Neural connections -->
    <circle cx="65" cy="95" r="4" fill="#fef3c7"/>
    <circle cx="95" cy="95" r="4" fill="#fef3c7"/>
    <circle cx="80" cy="115" r="4" fill="#fef3c7"/>
    <circle cx="60" cy="115" r="3" fill="#fef3c7" opacity="0.7"/>
    <circle cx="100" cy="115" r="3" fill="#fef3c7" opacity="0.7"/>
    <circle cx="80" cy="85" r="3" fill="#fef3c7" opacity="0.7"/>
    <line x1="65" y1="95" x2="80" y2="85" stroke="#fef3c7" stroke-width="1" opacity="0.5"/>
    <line x1="95" y1="95" x2="80" y2="85" stroke="#fef3c7" stroke-width="1" opacity="0.5"/>
    <line x1="65" y1="95" x2="60" y2="115" stroke="#fef3c7" stroke-width="1" opacity="0.5"/>
    <line x1="95" y1="95" x2="100" y2="115" stroke="#fef3c7" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="115" x2="80" y2="115" stroke="#fef3c7" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="115" x2="80" y2="115" stroke="#fef3c7" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Chat bubbles right -->
  <g transform="translate(640, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="50" rx="12" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <rect x="20" y="18" width="120" height="6" rx="3" fill="#e7e5e0"/>
    <rect x="20" y="30" width="80" height="6" rx="3" fill="#e7e5e0" opacity="0.5"/>
  </g>
  <g transform="translate(620, 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="60" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <rect x="16" y="14" width="170" height="6" rx="3" fill="#b45309" opacity="0.4"/>
    <rect x="16" y="26" width="140" height="6" rx="3" fill="#b45309" opacity="0.3"/>
    <rect x="16" y="38" width="100" height="6" rx="3" fill="#b45309" opacity="0.2"/>
  </g>
  <g transform="translate(650, 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="45" rx="12" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <rect x="18" y="14" width="130" height="6" rx="3" fill="#e7e5e0"/>
    <rect x="18" y="26" width="90" height="6" rx="3" fill="#e7e5e0" opacity="0.5"/>
  </g>

  <!-- Floating particles -->
  <circle cx="300" cy="60" r="3" fill="#b45309" opacity="0.2"/>
  <circle cx="550" cy="50" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="850" cy="250" r="4" fill="#b45309" opacity="0.15"/>
  <circle cx="200" cy="200" r="2.5" fill="#d97706" opacity="0.2"/>
  <circle cx="780" cy="350" r="3" fill="#f59e0b" opacity="0.15"/>

  <!-- Small text lines at bottom -->
  <g transform="translate(350, 330)">
    <rect x="0" y="0" width="60" height="4" rx="2" fill="#b45309" opacity="0.15"/>
    <rect x="70" y="0" width="40" height="4" rx="2" fill="#b45309" opacity="0.1"/>
    <rect x="120" y="0" width="80" height="4" rx="2" fill="#b45309" opacity="0.12"/>
  </g>
</svg>