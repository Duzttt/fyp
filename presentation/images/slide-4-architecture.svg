<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f4"/>
      <stop offset="100%" style="stop-color:#f0ece4"/>
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1c1917" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="500" fill="url(#bg4)"/>

  <!-- Title area decoration -->
  <rect x="380" y="20" width="200" height="3" rx="1.5" fill="#b45309" opacity="0.3"/>

  <!-- Frontend Layer -->
  <g transform="translate(330, 50)" filter="url(#shadow4)">
    <rect width="300" height="80" rx="12" fill="#ffffff" stroke="#6b8a7a" stroke-width="2"/>
    <rect width="300" height="4" rx="2" fill="#6b8a7a" y="0"/>
    <!-- Vue icon -->
    <path d="M40,30 L55,55 L70,30" fill="none" stroke="#6b8a7a" stroke-width="2.5"/>
    <path d="M48,30 L55,42 L62,30" fill="none" stroke="#6b8a7a" stroke-width="2"/>
    <text x="90" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Frontend</text>
    <text x="90" y="55" font-family="monospace" font-size="11" fill="#a8a29e">Vue 3 + TailwindCSS + Vite</text>
    <!-- Browser window dots -->
    <circle cx="220" cy="30" r="4" fill="#ef4444" opacity="0.6"/>
    <circle cx="234" cy="30" r="4" fill="#f59e0b" opacity="0.6"/>
    <circle cx="248" cy="30" r="4" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- Arrow down 1 -->
  <g transform="translate(470, 135)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="-4,28 4,28 0,36" fill="#a8a29e"/>
    <text x="15" y="20" font-family="monospace" font-size="10" fill="#a8a29e" letter-spacing="0.5">REST API</text>
  </g>

  <!-- Backend Layer -->
  <g transform="translate(230, 180)" filter="url(#shadow4)">
    <rect width="500" height="140" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect width="500" height="4" rx="2" fill="#b45309" y="0"/>
    <!-- Django icon -->
    <path d="M40,40 L55,25 L70,40 L55,55Z" fill="none" stroke="#b45309" stroke-width="2"/>
    <text x="90" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Backend — Django 5.2</text>

    <!-- Three services -->
    <g transform="translate(20, 60)">
      <rect width="145" height="65" rx="8" fill="#f0ece4"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1c1917">Document Service</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">PDF parsing, chunking,</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">embedding</text>
    </g>
    <g transform="translate(178, 60)">
      <rect width="145" height="65" rx="8" fill="#f0ece4"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1c1917">Retrieval Service</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">FAISS index,</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">similarity search</text>
    </g>
    <g transform="translate(336, 60)">
      <rect width="145" height="65" rx="8" fill="#f0ece4"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1c1917">Generation Service</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">Prompt construction,</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">LLM routing</text>
    </g>
  </g>

  <!-- Arrow down 2 -->
  <g transform="translate(470, 325)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="-4,28 4,28 0,36" fill="#a8a29e"/>
    <text x="15" y="20" font-family="monospace" font-size="10" fill="#a8a29e" letter-spacing="0.5">Provider API</text>
  </g>

  <!-- LLM Layer -->
  <g transform="translate(280, 370)" filter="url(#shadow4)">
    <rect width="400" height="80" rx="12" fill="#ffffff" stroke="#7a6b8a" stroke-width="2"/>
    <rect width="400" height="4" rx="2" fill="#7a6b8a" y="0"/>
    <!-- Brain icon -->
    <circle cx="50" cy="45" r="16" fill="none" stroke="#7a6b8a" stroke-width="1.5"/>
    <text x="45" y="50" font-family="system-ui, sans-serif" font-size="14" fill="#7a6b8a">G</text>
    <text x="80" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1c1917">LLM Providers</text>
    <text x="80" y="55" font-family="monospace" font-size="11" fill="#a8a29e">Gemini · OpenRouter · llama.cpp</text>

    <!-- Three provider badges -->
    <g transform="translate(80, 65)">
      <rect width="70" height="14" rx="7" fill="#e0e7ff"/>
      <text x="35" y="11" font-family="monospace" font-size="8" fill="#3730a3" text-anchor="middle">Gemini</text>
    </g>
    <g transform="translate(160, 65)">
      <rect width="90" height="14" rx="7" fill="#d1fae5"/>
      <text x="45" y="11" font-family="monospace" font-size="8" fill="#065f46" text-anchor="middle">OpenRouter</text>
    </g>
    <g transform="translate(260, 65)">
      <rect width="80" height="14" rx="7" fill="#ede9fe"/>
      <text x="40" y="11" font-family="monospace" font-size="8" fill="#5b21b6" text-anchor="middle">llama.cpp</text>
    </g>
  </g>

  <!-- Decorative elements -->
  <circle cx="120" cy="250" r="40" fill="#b45309" opacity="0.04"/>
  <circle cx="850" cy="150" r="30" fill="#b45309" opacity="0.04"/>
  <circle cx="100" cy="80" r="3" fill="#b45309" opacity="0.15"/>
  <circle cx="880" cy="400" r="2.5" fill="#f59e0b" opacity="0.2"/>
</svg>