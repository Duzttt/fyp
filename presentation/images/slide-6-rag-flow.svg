<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f4"/>
      <stop offset="100%" style="stop-color:#f0ece4"/>
    </linearGradient>
    <linearGradient id="accent6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <filter id="shadow6">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1917" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#bg6)"/>

  <!-- Indexing Flow Label -->
  <text x="100" y="40" font-family="monospace" font-size="11" fill="#a8a29e" letter-spacing="1.5" text-transform="uppercase">INDEXING — DOCUMENT UPLOAD</text>

  <!-- Indexing flow boxes -->
  <!-- PDF Upload -->
  <g transform="translate(40, 60)" filter="url(#shadow6)">
    <rect width="110" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <rect x="35" y="10" width="40" height="28" rx="4" fill="#fef3c7"/>
    <path d="M48,16 L48,30 L52,30 L52,20 L58,20 L58,16Z" fill="#b45309" opacity="0.7"/>
    <path d="M55,16 L61,16 L61,26 L55,26Z" fill="#d97706" opacity="0.6"/>
    <text x="55" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">PDF Upload</text>
  </g>

  <text x="162" y="90" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Text Extraction -->
  <g transform="translate(185, 60)" filter="url(#shadow6)">
    <rect width="120" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <text x="60" y="28" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" opacity="0.6">📄</text>
    <text x="60" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">Text Extraction</text>
  </g>

  <text x="317" y="90" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Chunking -->
  <g transform="translate(340, 60)" filter="url(#shadow6)">
    <rect width="100" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <g transform="translate(30, 10)">
      <rect width="40" height="8" rx="2" fill="#f0ece4"/>
      <rect y="10" width="35" height="8" rx="2" fill="#f0ece4"/>
      <rect y="20" width="40" height="8" rx="2" fill="#f0ece4"/>
      <rect y="30" width="30" height="8" rx="2" fill="#f0ece4"/>
    </g>
    <text x="50" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">Chunking</text>
  </g>

  <text x="452" y="90" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Embedding -->
  <g transform="translate(475, 60)" filter="url(#shadow6)">
    <rect width="100" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <!-- Vector representation -->
    <g transform="translate(25, 10)">
      <circle cx="25" cy="8" r="3" fill="#b45309" opacity="0.5"/>
      <circle cx="40" cy="14" r="3" fill="#b45309" opacity="0.4"/>
      <circle cx="15" cy="20" r="3" fill="#b45309" opacity="0.6"/>
      <circle cx="35" cy="25" r="3" fill="#b45309" opacity="0.35"/>
      <circle cx="50" cy="18" r="2" fill="#b45309" opacity="0.3"/>
    </g>
    <text x="50" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">Embedding</text>
  </g>

  <text x="587" y="90" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- FAISS Index (highlighted) -->
  <g transform="translate(610, 60)" filter="url(#shadow6)">
    <rect width="110" height="55" rx="10" fill="url(#accent6)"/>
    <text x="55" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">FAISS</text>
    <text x="55" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.8">Index</text>
  </g>

  <!-- Connecting line between flows -->
  <line x1="665" y1="120" x2="665" y2="180" stroke="#e7e5e0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="680" y="155" font-family="monospace" font-size="9" fill="#a8a29e">shared index</text>

  <!-- Retrieval Flow Label -->
  <text x="100" y="200" font-family="monospace" font-size="11" fill="#a8a29e" letter-spacing="1.5">RETRIEVAL — USER QUERY</text>

  <!-- Retrieval flow boxes -->
  <!-- User Query -->
  <g transform="translate(40, 220)" filter="url(#shadow6)">
    <rect width="110" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <circle cx="55" cy="22" r="12" fill="#fef3c7"/>
    <text x="55" y="27" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">?</text>
    <text x="55" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">User Query</text>
  </g>

  <text x="162" y="250" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Query Embedding -->
  <g transform="translate(185, 220)" filter="url(#shadow6)">
    <rect width="120" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <g transform="translate(35, 10)">
      <circle cx="25" cy="14" r="4" fill="#b45309" opacity="0.5"/>
      <circle cx="40" cy="8" r="3" fill="#b45309" opacity="0.4"/>
      <circle cx="15" cy="22" r="3" fill="#b45309" opacity="0.6"/>
    </g>
    <text x="60" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">Query Embedding</text>
  </g>

  <text x="317" y="250" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- FAISS Search (highlighted) -->
  <g transform="translate(340, 220)" filter="url(#shadow6)">
    <rect width="100" height="55" rx="10" fill="url(#accent6)"/>
    <text x="50" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">FAISS</text>
    <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.8">Search</text>
  </g>

  <text x="452" y="250" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Context Assembly -->
  <g transform="translate(475, 220)" filter="url(#shadow6)">
    <rect width="110" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <g transform="translate(30, 12)">
      <rect width="50" height="6" rx="2" fill="#e7e5e0"/>
      <rect y="9" width="45" height="6" rx="2" fill="#e7e5e0"/>
      <rect y="18" width="50" height="6" rx="2" fill="#e7e5e0"/>
      <rect y="27" width="35" height="6" rx="2" fill="#e7e5e0"/>
    </g>
    <text x="55" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">Context Assembly</text>
  </g>

  <text x="597" y="250" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Prompt + LLM -->
  <g transform="translate(620, 220)" filter="url(#shadow6)">
    <rect width="100" height="55" rx="10" fill="#ffffff" stroke="#e7e5e0" stroke-width="1"/>
    <text x="50" y="28" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" opacity="0.6">🤖</text>
    <text x="50" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#57534e" text-anchor="middle">Prompt + LLM</text>
  </g>

  <text x="732" y="250" font-size="16" fill="#b45309" font-weight="700">→</text>

  <!-- Cited Answer -->
  <g transform="translate(755, 220)" filter="url(#shadow6)">
    <rect width="110" height="55" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="55" y="28" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#16a34a">✓</text>
    <text x="55" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="600">Cited Answer</text>
  </g>

  <!-- Decorative -->
  <circle cx="900" cy="80" r="25" fill="#b45309" opacity="0.04"/>
  <circle cx="50" cy="370" r="20" fill="#b45309" opacity="0.04"/>
  <circle cx="850" cy="350" r="3" fill="#b45309" opacity="0.12"/>
</svg>